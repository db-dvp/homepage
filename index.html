<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대방산업개발 · 대방 엘리움</title>
<meta name="description" content="대방산업개발 기업 홈페이지와 대방 엘리움 브랜드 홈페이지로 들어가는 입구.">
<meta name="theme-color" content="#1c407d">
<link rel="icon" href="dvp/assets/img/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Oswald:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Noto Sans KR","Malgun Gothic",sans-serif;background:#0b1530;color:#fff;overflow:hidden;letter-spacing:-.02em;word-break:keep-all}
a{color:inherit;text-decoration:none}
.top{position:fixed;z-index:5;top:0;left:0;right:0;height:84px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.top img{height:30px;opacity:.95}
.lang{font-family:Oswald,sans-serif;font-size:14px;letter-spacing:.06em;height:30px;padding:0 14px;border:1px solid rgba(255,255,255,.7);border-radius:15px;background:none;color:#fff;cursor:pointer}
.lang:hover{background:#fff;color:#1c407d}
.gate{display:flex;height:100%}
.pane{position:relative;flex:1;overflow:hidden;transition:flex .8s cubic-bezier(.2,.7,.2,1);display:block}
.pane:hover,.pane:focus-visible{flex:1.45}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.06);transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter .6s}
.pane:hover .bg{transform:scale(1)}
.gate:hover .pane:not(:hover) .bg{filter:brightness(.55) saturate(.8)}
.pane::before{content:"";position:absolute;inset:0;z-index:1}
.dvp .bg{background-position:50% 50%}
.txt h2 .sub{display:block;margin-top:8px;font-family:Oswald,sans-serif;font-weight:300;font-size:26px;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
.eli .txt h2 .sub{color:#D5A67D;text-transform:none}
.dvp::before{background:linear-gradient(180deg,rgba(18,40,90,.55),rgba(18,40,90,.2) 40%,rgba(10,22,52,.85))}
.eli::before{background:linear-gradient(180deg,rgba(32,42,93,.5),rgba(32,42,93,.15) 40%,rgba(20,26,62,.88))}
.txt{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:0 56px 72px}
.k{font-family:Oswald,sans-serif;font-weight:300;font-size:14px;letter-spacing:.24em;opacity:.85}
.txt h2{margin:14px 0 14px;font-size:54px;font-weight:300;line-height:1.15;letter-spacing:-.05em}
.txt p{font-size:17px;font-weight:300;line-height:1.7;max-width:420px;opacity:.92}
.go{display:inline-flex;align-items:center;gap:12px;margin-top:30px;font-size:15px;font-weight:400;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.8)}
.go i{font-style:normal;transition:transform .3s}
.pane:hover .go i{transform:translateX(8px)}
.eli .go{border-color:#D5A67D;color:#F5F1E9}
.div{position:absolute;z-index:3;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35);pointer-events:none}
.foot{position:fixed;z-index:5;left:0;right:0;bottom:22px;text-align:center;font-size:12px;font-weight:300;letter-spacing:.04em;opacity:.65;pointer-events:none}
.txt>*{opacity:0;transform:translateY(20px);animation:up .9s forwards}
.txt>*:nth-child(2){animation-delay:.12s}.txt>*:nth-child(3){animation-delay:.24s}.txt>*:nth-child(4){animation-delay:.36s}
.eli .txt>*{animation-delay:.25s}.eli .txt>*:nth-child(2){animation-delay:.37s}.eli .txt>*:nth-child(3){animation-delay:.49s}.eli .txt>*:nth-child(4){animation-delay:.61s}
@keyframes up{to{opacity:1;transform:none}}
@media(max-width:800px){
  body{overflow:auto}
  .top{height:64px;padding:0 20px}.top img{height:24px}
  .gate{flex-direction:column;height:auto;min-height:100%}
  .pane{flex:none;height:50vh;min-height:360px}.pane:hover{flex:none}
  .txt{padding:0 24px 40px}.txt h2{font-size:34px}.txt h2 .sub{font-size:18px}.txt p{font-size:15px}
  .div,.foot{display:none}
}
</style>
</head>
<body>
<div class="top"><img src="dvp/assets/img/logo_en_w.png" alt="DAEBANG INDUSTRIAL DEVELOPMENT"><button class="lang" id="lang" type="button">EN</button></div>
<main class="gate">
  <a class="pane dvp" href="dvp/" aria-label="대방산업개발 기업 홈페이지">
    <div class="bg" style="background-image:url(dvp/assets/ph/hq.jpg)"></div>
    <div class="txt"><p class="k">CORPORATE</p><h2 data-en="Daebang Industrial Development<span class='sub'>대방산업개발</span>">대방산업개발<span class="sub">Daebang Industrial Development</span></h2><p data-en="A comprehensive developer creating new value — housing, contracting, development and F&amp;B.">종합 부동산 디벨로퍼. 주택·분양, 수주, 개발, F&amp;B 사업과 지속가능경영, 인재채용을 소개합니다.</p><span class="go"><span data-en="Enter corporate site">기업 홈페이지 들어가기</span><i>→</i></span></div>
  </a>
  <a class="pane eli" href="elium/" aria-label="대방 엘리움 브랜드 홈페이지">
    <div class="bg" style="background-image:url(elium/img/a3.jpg)"></div>
    <div class="txt"><p class="k">RESIDENTIAL BRAND</p><h2 data-en="Daebang Elium<span class='sub'>대방 엘리움</span>">대방 엘리움<span class="sub">Daebang Elium</span></h2><p data-en="Your Own Elysium — the residential brand of Daebang, and the places it builds.">대방산업개발의 주거 브랜드 엘리움. Your Own Elysium, 단지와 브랜드 이야기를 만나보세요.</p><span class="go"><span data-en="Enter Elium site">엘리움 사이트 들어가기</span><i>→</i></span></div>
  </a>
  
</main>
<div class="foot">© DAEBANG INDUSTRIAL DEVELOPMENT</div>
<script>
(function(){
  var L='ko';try{L=localStorage.getItem('lang')||'ko'}catch(e){}
  var b=document.getElementById('lang');
  function apply(){document.documentElement.lang=L;b.textContent=L==='en'?'KR':'EN';
    [].forEach.call(document.querySelectorAll('[data-en]'),function(e){if(!e.hasAttribute('data-ko'))e.setAttribute('data-ko',e.innerHTML);e.innerHTML=L==='en'?e.getAttribute('data-en'):e.getAttribute('data-ko')})}
  b.onclick=function(){L=L==='en'?'ko':'en';try{localStorage.setItem('lang',L)}catch(e){}apply()};
  apply();
})();
</script>
</body>
</html>
